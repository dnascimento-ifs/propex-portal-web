<!DOCTYPE html>
<!-- A tag <!DOCTYPE html> informa ao navegador a versão do html usado. -->

<!-- A tag <html> é onde todo o código fica, definimos nela a lang. -->
<html lang="pt-BR">

    <!-- A tag <head> é onde todos os metadados (que não aparecem na página) ficam. -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Linhas que Contam | Bordadeiras de Tobias Barreto</title>

        <!-- Importa as famílias Playfair Display e Inter -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap">


        <!-- Definição de estilo CSS interno -->
        <style>
            body { font-family: 'Inter', sans-serif; }
            .font-serif-custom { font-family: 'Playfair Display', serif; }
        </style>

        <link rel="stylesheet" href="estilos.css">

    </head>

    <!-- A tag <body> é onde todo o conteúdo visível e interativo da página fica. -->
    <!-- Adicionar ao body o tailwind ou css puro. -->
    <body>
        
        <!-- Primeiro passo é criar o cabeçalho. -->
        <header class="cabecalho">

            <!-- "Título" da página na página -->
            <div class="cabecalho-container">

                <a href="#" class="logo">
                    Linhas que <span class="logo-italico">Contam</span>
                </a>

                <!-- Menu de navegação da página -->
                <nav class="menu-navegacao">
                    <a href="#historia" class="menu-link">HISTÓRIA</a>
                    <a href="#documentarios" class="menu-link">DOCUMENTÁRIOS</a>
                    <a href="#cartografia" class="menu-link">CARTOGRAFIA</a>
                </nav>

                <!-- Link para os vídeo na página -->

                <!--
                    Não senti que ter um botão para os vídeo seja necessário,
                    pois no menu de navegação já tem um link interno do site
                    para a mesma aba
                -->

                <a href="#documentarios" class="botao-destaque">
                    DOCUMENTÁRIOS
                </a>

            </div>

        </header>

        <!-- Conteúdo principal da página -->
        conteúdo princial

        <!-- Rodapé da página -->
        <footer>
            rodapé
        </footer>

    </body>

</html>
