<!-- A tag <!DOCTYPE html> informa ao navegador a versão do html usado. -->
<!DOCTYPE html>

<!-- A tag <html></html> é onde todo o código fica, definimos nela a lang. -->
<html lang="pt-BR">

    <!-- A tag <head></head> é onde todos os metadados (que não aparecem na página) ficam. -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" contet="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <!-- A tag <body></body> é onde todo o conteúdo visível e interativo da página fica. -->
    <body>
        Olá, Mundo!
    </body>

</html>
